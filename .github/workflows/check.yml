name: C checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile game and check rules
        run: |
          set -eu
          gcc -std=c11 -Wall -Wextra -Werror -pedantic GrowGarden/Mini/ListeningGarden-Mini.c -o /tmp/garden-mini
          printf '%s\n' 9 1 1 3 '' 3 '' 3 '' 3 '' 3 '' 3 '' 3 '' 3 '' 4 1 1 0 | /tmp/garden-mini > /tmp/mini-result
          grep -Fq 'ยังไม่ได้ใส่ปุ๋ย - เมล็ดยังไม่เติบโต' /tmp/mini-result
          gcc -std=c11 -Wall -Wextra -Werror -pedantic GrowGarden/Mini/ListeningGarden-Mini-Submission.c -o /tmp/garden-submission
          for source in GrowGarden/Mini/*.c; do gcc -E -P "$source" -o "/tmp/$(basename "$source").i"; done
          cmp /tmp/ListeningGarden-Mini.c.i /tmp/ListeningGarden-Mini-Submission.c.i
