name: C checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile game and check rules
        run: |
          set -eu
          gcc -std=c11 -Wall -Wextra -Werror -pedantic share/ListeningGarden.c -o /tmp/garden-class
          gcc -std=c11 -Wall -Wextra -Werror -pedantic tests/test_garden.c -o /tmp/check-rules
          /tmp/check-rules
          printf '%s\n' 1 1 2 2 2 2 2 2 2 2 3 1 1 1 3 | /tmp/garden-class > /tmp/class-round.txt
          grep -Fq 'คะแนนรวม' /tmp/class-round.txt
